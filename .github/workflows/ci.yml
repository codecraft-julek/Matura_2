# Runs on every push and pull request. If any step fails, GitHub shows a red ❌
# and you know not to deploy. Vercel can be set to only deploy when this passes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run content:check
      - run: npm run build
